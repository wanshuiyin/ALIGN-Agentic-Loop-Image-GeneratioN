 ['矾绢','silk ground · 胶矾水','细绢绷框,胶矾水刷三至五遍,使墨不洇、色能分染。绢经九百年氧化已成暖褐,补绢与污渍处更深;之后每一层薄染都透着这个底色。左端另接一段拖尾纸,留给题跋。'],

var SEAL_TEXTS=['取法','不取景','珍藏','審定'];
var TITLE_TEXT='清明上河圖 · 武漢';
var ALL_TEXT=COLOPHON+SIGN_TEXTS.join('')+TITLE_TEXT+SEAL_TEXTS.join('');

/* ---------------------------------------------------------------- ctx
   makeCtx(p, opts) — opts.SW / opts.CW override the canvas width and paper width (the harness uses 1200 / 0).
   Modules must read ctx.SW and ctx.CW, never the globals. */
function makeCtx(p,opts){
  opts=opts||{};
  var W=opts.SW||SW, H=SH, CWx=opts.CW===undefined?CW:opts.CW;
  var seed=20260404;
  function R(){ seed|=0; seed=seed+0x6D2B79F5|0; var t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }
  function rr(a,b){ return a+R()*(b-a); }
  function ri(a,b){ return Math.floor(rr(a,b+1)); }
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function smoothstep(a,b,v){ var t=clamp((v-a)/(b-a),0,1); return t*t*(3-2*t); }
  function col(c,a){ return [c[0],c[1],c[2],a]; }
  function noise(x,y,z){ return p.noise(x,y,z); }
  p.noiseSeed(7);
  function depth(y){ return 0.75+0.25*clamp((y-Y_FAR)/(Y_NEAR-Y_FAR),0,1); }

  var S=STAGES.map(function(){ return []; });
  function add(st,x,f){ S[st].push({x:x,f:f}); }

  // ---------------- masks: z raster (nearer object wins) and water raster
  var Z=new Uint16Array(W*H), WATER=new Uint8Array(W*H);
  function hidden(x,y,z){ if(x<CWx)return true; if(x>=W||y<0||y>=H||x<0)return false; return Z[(y|0)*W+(x|0)]>z+1; }
  function solidAt(x,y){ if(x<0||x>=W||y<0||y>=H)return false; return Z[(y|0)*W+(x|0)]>0; }
  function waterAt(x,y){ if(x<0||x>=W||y<0||y>=H)return false; return WATER[(y|0)*W+(x|0)]===1; }
  function stampZ(fp){ var z=clamp(Math.round(fp.z),1,65535), x0=Math.max(0,Math.floor(fp.x0)), x1=Math.min(W-1,Math.ceil(fp.x1)), y0=Math.max(0,Math.floor(fp.y0)), y1=Math.min(H-1,Math.ceil(fp.y1));
    for(var y=y0;y<=y1;y++){ var row=y*W; for(var x=x0;x<=x1;x++){ if(Z[row+x]>=z)continue; if(fp.inside(x,y))Z[row+x]=z; } } }
  function fillPoly(raster,poly,val){ var n=poly.length, ymin=1e9, ymax=-1e9, i;
    for(i=0;i<n;i++){ ymin=Math.min(ymin,poly[i][1]); ymax=Math.max(ymax,poly[i][1]); }
    for(var y=Math.max(0,Math.ceil(ymin));y<=Math.min(H-1,Math.floor(ymax));y++){ var xs=[], sy=y+0.5;
      for(i=0;i<n;i++){ var a=poly[i], b=poly[(i+1)%n]; if((a[1]<=sy)!==(b[1]<=sy))xs.push(a[0]+(sy-a[1])/(b[1]-a[1])*(b[0]-a[0])); }
      xs.sort(function(u,v){ return u-v; });
      for(i=0;i+1<xs.length;i+=2){ var xa=Math.max(0,Math.ceil(xs[i])), xb=Math.min(W-1,Math.floor(xs[i+1])); for(var x=xa;x<=xb;x++)raster[y*W+x]=val; } } }
  function stampWater(poly){ fillPoly(WATER,poly,1); }
  function clearAround(fn,x,y,r){ return !fn(x,y)&&!fn(x-r,y)&&!fn(x+r,y)&&!fn(x,y-r)&&!fn(x,y+r); }
  var masks={stampZ:stampZ,hidden:hidden,solidAt:solidAt,stampWater:stampWater,waterAt:waterAt,clearAround:clearAround};

  // ---------------- polygon helpers (wash uses them; footprints may too): even-odd inside test, distance to the nearest edge
  function polyInside(poly){ var n=poly.length; return function(x,y){ var c=false; for(var i=0,j=n-1;i<n;j=i++){ var a=poly[i], b=poly[j]; if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c; } return c; }; }
  function polyEdge(poly){ var n=poly.length; return function(x,y){ var best=1e9; for(var i=0,j=n-1;i<n;j=i++){ var ax=poly[j][0], ay=poly[j][1], bx=poly[i][0], by=poly[i][1], dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy;
        var t=L2>0?clamp(((x-ax)*dx+(y-ay)*dy)/L2,0,1):0, px=ax+dx*t-x, py=ay+dy*t-y, d=px*px+py*py; if(d<best)best=d; } return Math.sqrt(best); }; }

  // ---------------- line primitives
  function line(st,x,c,al,w,x1,y1,x2,y2){ var cc=col(c,al); add(st,x,function(g){ g.stroke(cc[0],cc[1],cc[2],cc[3]); g.strokeWeight(w); g.strokeCap(g.ROUND); g.line(x1,y1,x2,y2); }); }
  function pline(st,x,c,al,w,pts,curve){ if(pts.length<2)return; var cc=col(c,al);
    add(st,x,function(g){ g.noFill(); g.stroke(cc[0],cc[1],cc[2],cc[3]); g.strokeWeight(w); g.strokeCap(g.ROUND); g.beginShape();
      if(curve){ g.curveVertex(pts[0][0],pts[0][1]); for(var i=0;i<pts.length;i++)g.curveVertex(pts[i][0],pts[i][1]); var l=pts[pts.length-1]; g.curveVertex(l[0],l[1]); }
      else for(var k=0;k<pts.length;k++)g.vertex(pts[k][0],pts[k][1]);
      g.endShape(); }); }

  // ruler line: even weight, PROJECT cap, both ends dwell a little (界笔靠尺时的两端微重), overshoot `over` px past each true end.
  // With z the line is sampled every 2 px against masks.hidden and only the visible runs are drawn; a run cut by an occluder gets no dwell there.
  function rline(st,x,c,al,w,x1,y1,x2,y2,z,over){
    if(over===undefined)over=rr(0.5,1.5);
    var dx=x2-x1, dy=y2-y1, L=Math.sqrt(dx*dx+dy*dy); if(L<0.05)return;
    var ux=dx/L, uy=dy/L, a=al*rr(0.92,1.08), segs=[], run=null, i;
    if(z===undefined)segs.push([x1,y1,x2,y2,true,true]);
    else { var n=Math.max(1,Math.ceil(L/2));
      for(i=0;i<=n;i++){ var t=i/n, px=x1+dx*t, py=y1+dy*t, vis=!hidden(px,py,z);
        if(vis){ if(!run)run=[px,py,px,py,i===0,false]; else { run[2]=px; run[3]=py; } if(i===n)run[5]=true; }
        if(run&&(!vis||i===n)){ if(run[2]!==run[0]||run[3]!==run[1]||run[4]||run[5])segs.push(run); run=null; } } }
    if(!segs.length)return;
    for(i=0;i<segs.length;i++){ var s=segs[i]; if(s[4]){ s[0]-=ux*over; s[1]-=uy*over; } if(s[5]){ s[2]+=ux*over; s[3]+=uy*over; } }
    var cc=col(c,a), dw=w*1.35, da=Math.round(a*0.55), dl=1.2;
    add(st,x,function(g){ g.strokeCap(g.PROJECT); var k,s;
      g.stroke(cc[0],cc[1],cc[2],cc[3]); g.strokeWeight(w); for(k=0;k<segs.length;k++){ s=segs[k]; g.line(s[0],s[1],s[2],s[3]); }
      g.stroke(cc[0],cc[1],cc[2],da); g.strokeWeight(dw); for(k=0;k<segs.length;k++){ s=segs[k]; if(s[4])g.line(s[0],s[1],s[0]+ux*dl,s[1]+uy*dl); if(s[5])g.line(s[2]-ux*dl,s[3]-uy*dl,s[2],s[3]); } }); }

  // Catmull-Rom resample of a sparse polyline at ~2 px; dense input (≤3 px spacing) is used as given.
  function resample(pts){ var n=pts.length, len=0, i; for(i=1;i<n;i++){ var ex=pts[i][0]-pts[i-1][0], ey=pts[i][1]-pts[i-1][1]; len+=Math.sqrt(ex*ex+ey*ey); }
    if(len/(n-1)<=3)return pts.map(function(q){ return [q[0],q[1]]; });
    var out=[];
    if(n===2){ var m=Math.max(2,Math.ceil(len/2)); for(i=0;i<=m;i++){ var t=i/m; out.push([pts[0][0]+(pts[1][0]-pts[0][0])*t,pts[0][1]+(pts[1][1]-pts[0][1])*t]); } return out; }
    for(i=0;i<n-1;i++){ var p0=pts[Math.max(0,i-1)], p1=pts[i], p2=pts[i+1], p3=pts[Math.min(n-1,i+2)], seg=Math.sqrt((p2[0]-p1[0])*(p2[0]-p1[0])+(p2[1]-p1[1])*(p2[1]-p1[1])), m2=Math.max(1,Math.ceil(seg/2));
      for(var j=0;j<m2;j++){ var s=j/m2, s2=s*s, s3=s2*s;
        out.push([0.5*(2*p1[0]+(-p0[0]+p2[0])*s+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*s2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*s3),
                  0.5*(2*p1[1]+(-p0[1]+p2[1])*s+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*s2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*s3)]); } }
    out.push([pts[n-1][0],pts[n-1][1]]); return out; }

  // 白描 line: gen3 outline() — jitter, three pieces (thin entry 35 %, full body to 72 %, lighter exit) with widths ×0.6/×1.25/×0.7 and alpha ×0.8/×1/×0.85.
  // With z, samples hidden by a nearer object are dropped and the visible runs are drawn.
  var WM=[0.6,1.25,0.7,1], AM=[0.8,1,0.85,1];
  function bline(st,x,c,al,w,pts,z){
    if(pts.length<2)return;
    var q=resample(pts), sparse=q.length!==pts.length, jit=sparse?0.36:0.6, i;
    for(i=0;i<q.length;i++){ q[i][0]+=(R()-0.5)*jit; q[i][1]+=(R()-0.5)*jit; }
    var n=q.length, runs=[], run=null, piece;
    if(n<5){ piece=function(){ return 3; }; }
    else { var a=Math.floor(n*0.35), b=Math.floor(n*0.72); piece=function(k){ return k<a?0:k<b?1:2; }; }
    var cur=-1;
    for(i=0;i<n;i++){ var vis=z===undefined||!hidden(q[i][0],q[i][1],z), k=piece(i);
      if(!vis){ if(run&&run.pts.length>1)runs.push(run); run=null; continue; }
      if(run&&k!==cur){ run.pts.push(q[i]); if(run.pts.length>1)runs.push(run); run=null; }
      if(!run){ run={k:k,pts:[]}; cur=k; }
      run.pts.push(q[i]); }
    if(run&&run.pts.length>1)runs.push(run);
    if(!runs.length)return;
    var cols=AM.map(function(m){ return col(c,al*m); }), ws=WM.map(function(m){ return w*m; });
    add(st,x,function(g){ g.noFill(); g.strokeCap(g.ROUND);
      for(var r=0;r<runs.length;r++){ var cc=cols[runs[r].k], ps=runs[r].pts; g.stroke(cc[0],cc[1],cc[2],cc[3]); g.strokeWeight(ws[runs[r].k]); g.beginShape(); for(var j=0;j<ps.length;j++)g.vertex(ps[j][0],ps[j][1]); g.endShape(); } }); }

  // long marks in 70–190 px pieces sharing one point; PROJECT cap, constant alpha per row
  function chunks(st,pts,c,al,sw,len){ var a=0, cc=col(c,al);
    var piece=function(seg){ add(st,(seg[0][0]+seg[seg.length-1][0])/2,function(g){ g.noFill(); g.stroke(cc[0],cc[1],cc[2],cc[3]); g.strokeWeight(sw); g.strokeCap(g.PROJECT); g.beginShape(); for(var i=seg.length-1;i>=0;i--)g.vertex(seg[i][0],seg[i][1]); g.endShape(); }); };
    while(a<pts.length-1){ var want=len||rr(70,190), b=a+1; while(b+1<pts.length&&pts[b][0]-pts[a][0]<want)b++;
      piece(pts.slice(a,b+1)); if(b===pts.length-1)break; a=b; } }

  // pigment laid as soft dabs on a jittered grid — no scanlines, granular like mineral colour. ink = target coverage 0..1.
  // reg={x0,x1,y0,y1,z,inside(x,y),edge?(x,y),tone?}; pred(x,y)→bool optional; opts {pool:bool, angle:fn(x,y)}
  function dabs(st,reg,c0,ink,step,rad,pred,opts){ opts=opts||{};
    var T=reg.tone===undefined?1:reg.tone, c=T>=0.99?c0:c0.map(function(v,i){ return Math.round(v*T+[150,150,140][i]*(1-T)); }); ink=ink*(0.5+0.5*T);
    var OVER=Math.PI*rad*rad/(step*step), a=1-Math.pow(1-ink,1/Math.max(1,OVER)), group=[], inside=reg.inside, pool=!!opts.pool, angle=opts.angle;
    var flush=function(){ if(!group.length)return; var ds=group, cc=c; add(st,ds[0][0],function(g){ var ctx=g.drawingContext; for(var i=0;i<ds.length;i++){ var d=ds[i]; var gr=ctx.createRadialGradient(d[0],d[1],0,d[0],d[1],d[2]); gr.addColorStop(0,'rgba('+cc[0]+','+cc[1]+','+cc[2]+','+d[3]+')'); gr.addColorStop(0.6,'rgba('+cc[0]+','+cc[1]+','+cc[2]+','+(d[3]*0.85).toFixed(3)+')'); gr.addColorStop(1,'rgba('+cc[0]+','+cc[1]+','+cc[2]+',0)'); ctx.fillStyle=gr; ctx.beginPath(); if(d[4]!==undefined)ctx.ellipse(d[0],d[1],d[2]*1.7,d[2]*0.75,d[4],0,Math.PI*2); else ctx.arc(d[0],d[1],d[2],0,Math.PI*2); ctx.fill(); } }); group=[]; };
    var edgeOf=reg.edge||function(x,y){ var ds=[rad*0.35,rad*0.7,rad]; for(var k=0;k<3;k++){ var d=ds[k]; if(!(inside(x-d,y)&&inside(x+d,y)&&inside(x,y-d)&&inside(x,y+d)))return d*0.7; } return rad; };
    for(var y=reg.y0;y<=reg.y1;y+=step){ for(var x=reg.x0;x<=reg.x1;x+=step){ var xx=x+rr(-step*0.5,step*0.5), yy=y+rr(-step*0.5,step*0.5);
        if(!inside(xx,yy)||hidden(xx,yy,reg.z))continue; if(pred&&!pred(xx,yy))continue;
        if(!pool&&p.noise(xx*0.02+st*5,yy*0.02)<0.3&&R()<0.6)continue;
        var edge=edgeOf(xx,yy), r=Math.min(rad*Math.exp(rr(-0.6,0.55)),Math.max(1.2,edge*0.9+0.5));
        var dab=[xx,yy,r,(pool?a*rr(0.9,1.1):a*rr(0.75,1.25)*(0.8+0.5*p.noise(xx*0.05,yy*0.05))).toFixed(3)];
        if(angle)dab.push(angle(xx,yy)+rr(-0.2,0.2));
        group.push(dab); if(group.length>=8)flush(); } flush(); } }

  // dabs over a polygon; colour stays inside the outline (radius shrinks toward the edge)
  function wash(st,poly,c,ink,step,rad,z){ var x0=1e9,x1=-1e9,y0=1e9,y1=-1e9; for(var i=0;i<poly.length;i++){ x0=Math.min(x0,poly[i][0]); x1=Math.max(x1,poly[i][0]); y0=Math.min(y0,poly[i][1]); y1=Math.max(y1,poly[i][1]); }
    dabs(st,{x0:x0,x1:x1,y0:y0,y1:y1,z:z,inside:polyInside(poly),edge:polyEdge(poly)},c,ink,step,rad); }

  var brush=makeBrushText(R);

  // seal: 2 or 4 characters, three offset 印泥 layers, white 文, 30 edge chips, ±3° rotation
  function sealStamp(st,x,y,sz,text){ var rot=rr(-3,3)*Math.PI/180, offs=[[0,0],[rr(-0.8,0.8),rr(-0.8,0.8)],[rr(-0.8,0.8),rr(-0.8,0.8)]], chips=[], i;
    for(i=0;i<30;i++){ var px=rr(-0.5,0.5)*sz, py=rr(-0.5,0.5)*sz; if(Math.abs(px)>sz*0.4||Math.abs(py)>sz*0.4)chips.push([px,py,rr(0.5,1.6)]); }
    var chars=text.split(''), cell=sz/2;
    add(st,x,function(g){ var c=g.drawingContext; c.save(); c.translate(x+sz/2,y+sz/2); c.rotate(rot);
      for(var k=0;k<offs.length;k++){ c.fillStyle='rgba(178,52,40,'+(k===0?0.8:0.22)+')'; c.beginPath(); c.roundRect(-sz/2+offs[k][0],-sz/2+offs[k][1],sz,sz,2); c.fill(); }
      c.fillStyle='rgba(241,231,210,0.92)'; c.font='bold '+Math.round(sz*(chars.length>2?0.42:0.5))+'px "Ma Shan Zheng","Kaiti SC",serif'; c.textAlign='center'; c.textBaseline='middle';
      for(var j=0;j<chars.length;j++){ var cx=chars.length>2?(j%2===0?0.5:-0.5)*cell:0, cy=chars.length>2?(j<2?-0.5:0.5)*cell:(j===0?-0.5:0.5)*cell; c.fillText(chars[j],cx,cy+1); }
      c.fillStyle='rgba(214,196,160,0.75)'; for(var q=0;q<chips.length;q++){ c.beginPath(); c.arc(chips[q][0],chips[q][1],chips[q][2],0,Math.PI*2); c.fill(); } c.restore(); }); }

  return {SW:W,SH:H,CW:CWx,PW:W-CWx,Y_FAR:Y_FAR,Y_NEAR:Y_NEAR,depth:depth,OBL:OBL,ST:ST,C:C,
    R:R,rr:rr,ri:ri,clamp:clamp,smoothstep:smoothstep,noise:noise,col:col,
    S:S,add:add,line:line,pline:pline,rline:rline,bline:bline,chunks:chunks,dabs:dabs,wash:wash,
    brush:brush,sealStamp:sealStamp,masks:masks,polyInside:polyInside,polyEdge:polyEdge,
    reg:{buildings:[],boats:[],trees:[],figures:[],zones:[],slots:[]}};
}

/* ---------------------------------------------------------------- silk
   Warm-brown oxidised silk: fine grain, warp/weft, short fibres, a few large stains and small ones; paper sheet for x<CW. */
function bakeSilk(p,ctx){ var W=ctx.SW, H=ctx.SH, CWx=ctx.CW, R=ctx.R, rr=ctx.rr, scale=W*H/(SW*SH);
  var s=p.createGraphics(W,H); s.pixelDensity(2); s.background(C.silk[0],C.silk[1],C.silk[2]);
  if(CWx>0){ s.noStroke(); s.fill(C.paper[0],C.paper[1],C.paper[2]); s.rect(0,0,CWx,H); }
  var c=s.drawingContext, pd=2, w=W*pd, h=H*pd, img=c.getImageData(0,0,w,h), d=img.data, sd=99;
  var rn=function(){ sd|=0; sd=sd+0x6D2B79F5|0; var t=Math.imul(sd^sd>>>15,1|sd); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
  for(var i=0;i<d.length;i+=4){ var n=(rn()-0.5)*3; d[i]+=n; d[i+1]+=n*0.95; d[i+2]+=n*0.8; } c.putImageData(img,0,0);
  var dk=C.silkDk; s.strokeWeight(0.3);
  s.stroke(dk[0],dk[1],dk[2],6); for(var x=0;x<W;x+=1.3)s.line(x+(x%2.6<1.3?0.15:0),0,x,H);
  s.stroke(dk[0],dk[1],dk[2],3); for(var y=0;y<H;y+=1.6)s.line(0,y,W,y+rr(-0.3,0.3));
  var nf=Math.round(12000*scale); for(i=0;i<nf;i++){ var fx=R()*W, fy=R()*H, L=rr(8,40); s.line(fx,fy,fx+L,fy); }
  var nb=Math.max(1,Math.round(9*scale)); for(i=0;i<nb;i++){ var bx=R()*W, by=R()*H, r=rr(400,900), g0=c.createRadialGradient(bx*pd,by*pd,0,bx*pd,by*pd,r*pd), tn=R()<0.6?'90,70,40':'230,210,170'; g0.addColorStop(0,'rgba('+tn+',0.05)'); g0.addColorStop(1,'rgba('+tn+',0)'); c.fillStyle=g0; c.fillRect((bx-r)*pd,(by-r)*pd,r*2*pd,r*2*pd); }
  var ns=Math.max(2,Math.round(40*scale)); for(i=0;i<ns;i++){ var sx=R()*W, sy=R()*H, r2=rr(100,300), g1=c.createRadialGradient(sx*pd,sy*pd,0,sx*pd,sy*pd,r2*pd), tone=R()<0.5?'120,100,70':'255,250,235'; g1.addColorStop(0,'rgba('+tone+',0.03)'); g1.addColorStop(1,'rgba('+tone+',0)'); c.fillStyle=g1; c.fillRect((sx-r2)*pd,(sy-r2)*pd,r2*2*pd,r2*2*pd); }
  if(CWx>0){ s.stroke(dk[0],dk[1],dk[2],60); s.strokeWeight(1); s.line(CWx,0,CWx,H); }
  return s; }

// stage 0: the silk revealed in 50-px columns, right to left
function revealSilk(ctx,silkImg){ var W=ctx.SW, H=ctx.SH; for(var x=0;x<W;x+=50){ (function(a,w){ ctx.add(ST.SILK,a+25,function(g){ g.image(silkImg,a,0,w,H,a,0,w,H); }); })(x,Math.min(50,W-x)); } }
/* mod-arch.js — 界画 architecture on the shared ctx: Song timber buildings, the modern kinds built from the same parts,
   the 长江大桥 truss, quays, walls, steps, embankments, 牌坊.
   Public: ARCH.footprint(ctx,spec) (pure) and ARCH.build(ctx,spec) → {fp,slots}. spec.kind picks the builder (default 'hall').
   Conventions: (x,y) = ground contact of the front-right corner, w = frontage to the left, d = depth along ctx.OBL
   (dir=-1 mirrors the depth vector so the right flank shows), h = ground-to-eave height, z defaults to y.
   Geometry never consumes ctx.R — footprint() and build() see the same shapes; only the drawing is random. */
var ARCH=(function(){
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function bbox(P){ var b={x0:1e9,x1:-1e9,y0:1e9,y1:-1e9}; for(var i=0;i<P.length;i++){ var q=P[i]; if(q[0]<b.x0)b.x0=q[0]; if(q[0]>b.x1)b.x1=q[0]; if(q[1]<b.y0)b.y0=q[1]; if(q[1]>b.y1)b.y1=q[1]; } return b; }

      if(opt.lookX!==undefined&&(pose==='pointing'||pose==='stand'||pose==='photographer'))dir=opt.lookX>f.x?1:-1;

    var crowdFigs=[];
    for(i=0;i<groups.length;i++){ var G=groups[i], gf=G.figs; for(j=0;j<gf.length;j++){ if(G.opt.ring&&gf[j].pose==='dance'&&(j&1))continue; crowdFigs.push(toFig(gf[j],G.opt)); } }

    // 朱砂 budget: a dozen red garments in the whole scroll (float balls, flags, 幌子 edges and 春聯 come on top)
    for(i=0;i<all.length;i++)if(all[i].tint==='zhusha'&&all[i].pose!=='swimmer')red.push(all[i]);
    while(red.length>12){ var kd=ri(0,red.length-1); red[kd].tint='indigo'; red.splice(kd,1); }
    for(i=0;i<all.length;i++)ctx.masks.stampZ(FIGURE.footprint(ctx,all[i]));

    for(i=0;i<arch.length;i++){ var s=arch[i], rec=ARCH.build(s.edge?edgeCtx(425):ctx,s), sl=rec.slots, bz=s.z===undefined?s.y:s.z;
      if(sl.huangzi)blob({x:sl.huangzi.cx,y:sl.huangzi.cy,w:4,h:30,style:'fan',board:false,z:bz,vertical:true});
      if(s.kind==='shopfront'&&R()<0.35&&sl.ground)blob({x:sl.ground.x1-rr(6,12),y:sl.ground.y-s.h*0.55,w:7,h:22,style:'pai',board:'ink',z:bz,vertical:true}); }

    WATER.build(ctx,{x0:2560,x1:3236,yTop:MIST,yBot:LB,flow:[-1,-0.06],density:0.9,kind:'river',piers:bridgePiers});
    WATER.build(ctx,{x0:2200,x1:2560,yTop:MIST,yBot:LB,flow:[-1,-0.06],density:0.45,kind:'river'});
    WATER.build(ctx,{x0:1640,x1:2200,yTop:MIST,yBot:LB,flow:[-1,-0.07],flow2:HANFLOW,seam:[1935,146],seamLen:250,density:0.7,kind:'confluence'});

/* tail.js — page runtime. Concatenated after main.js; closes the shared script element.

   Split with main.js (the integrator's file):

     main.js   new p5(function(p){
                 var ctx=makeCtx(p), A=newApp(p,ctx);
                 function build(){ ...phase A: specs, masks.stampWater, masks.stampZ(footprints), CROWD.place;
                                   phase B: every build(), TEXT.sign / TEXT.colophon / seals...; finishBuild(A); }
                 attachApp(A,build);
               });
               main.js holds the composition only. It never touches the DOM, p.setup/p.draw, fonts, silk or ordering.

     tail.js   newApp(p,ctx)       the state record the page runs on: g, silkImg, strokes, stageStart, drawn, progress,
                                   playing, dirty, camX, follow, speed, T, built, drag state, lastPos, rec, chunks,
                                   checkpoints (index → image), boundaries (index → true)
               finishBuild(A)      the ordering loop: sorts every ctx.S[stage] right→left, concatenates into A.strokes,
                                   fills A.stageStart, sets the two checkpoint boundaries at ST.TREES and ST.OCHRE, marks built
               attachApp(A,build)  p.setup (canvas VW×CH, g SW×SH at pd 2, deep links #p/#cam/#seq/#full, the fonts.load gate on
                                   ALL_TEXT, then bakeSilk → revealSilk → build → #seq replay), p.draw, mouse/touch drag,
                                   steps/play/speed/progress/follow UI, keyboard, WebM recording, syncTo/targetIndex/stageOf
               title instance      second p5 sketch writing the page title with the brush engine
               the closing script tag */

function newApp(p,ctx){ return {p:p,ctx:ctx,g:null,silkImg:null,strokes:[],stageStart:[],drawn:0,progress:0,playing:false,dirty:true,camX:SW-VW,follow:true,speed:1,T:120,built:false,dragging:null,dragX0:0,camX0:0,lastPos:null,rec:null,chunks:[],checkpoints:{},boundaries:{}}; }

function finishBuild(A){ var S=A.ctx.S, idx=0, i, j; A.strokes=[]; A.stageStart=[];
  for(i=0;i<S.length;i++){ S[i].sort(function(a,b){ return b.x-a.x; }); A.stageStart[i]=idx; for(j=0;j<S[i].length;j++)A.strokes.push(S[i][j]); idx+=S[i].length; }
  A.stageStart.push(idx); A.boundaries={}; A.boundaries[A.stageStart[ST.TREES]]=true; A.boundaries[A.stageStart[ST.OCHRE]]=true;
  A.built=true; A.dirty=true; }

function attachApp(A,build){ var p=A.p, RECNAME='qingming-wuhan-process.webm';
  function base(){ A.g.push(); A.g.background(C.silk[0],C.silk[1],C.silk[2]); A.g.pop(); }
  function targetIndex(t){ var n=STAGES.length, st=Math.min(n-1,Math.floor(t*n)), fr=t*n-st; return Math.round(A.stageStart[st]+fr*(A.stageStart[st+1]-A.stageStart[st])); }
  function syncTo(t){ var tgt=targetIndex(t), g=A.g;
    if(tgt<A.drawn){ var start=0; for(var k in A.checkpoints){ var ki=+k; if(ki<=tgt&&ki>start)start=ki; } base(); if(start){ g.push(); g.image(A.checkpoints[start],0,0,SW,SH); g.pop(); } A.drawn=start; }
    if(tgt>A.drawn){ g.push(); while(A.drawn<tgt){ A.strokes[A.drawn++].f(g); if(A.boundaries[A.drawn]&&!A.checkpoints[A.drawn]){ g.pop(); A.checkpoints[A.drawn]=g.get(); g.push(); } } g.pop(); }
    A.lastPos=A.drawn?A.strokes[A.drawn-1].x:null; }
  function stageOf(t){ return Math.min(STAGES.length-1,Math.floor(t*STAGES.length)); }
  // ---------- UI ----------
  function $(s){ return document.querySelector(s); }
  var playBtn=$('#play'), prog=$('#prog'), pct=$('#pct'), stepsEl=$('#steps'), recBtn=$('#rec');
  STAGES.forEach(function(s,i){ var b=document.createElement('button'); b.innerHTML='<b>'+(i<9?'0':'')+(i+1)+'</b>'+s[0]; b.addEventListener('click',function(){ A.progress=(i+0.001)/STAGES.length; A.playing=false; A.dirty=true; ui(); }); stepsEl.appendChild(b); });
  var uiStage=-1;
  function ui(){ prog.value=Math.round(A.progress*1000); pct.textContent=Math.round(A.progress*100)+'%'; playBtn.textContent=A.playing?'❚❚ 暂停':'▶ 播放';
    var st=stageOf(A.progress); if(st!==uiStage){ uiStage=st; var kids=stepsEl.children; for(var i=0;i<kids.length;i++)kids[i].classList.toggle('on',i===st); $('#dname').textContent=STAGES[st][0]; $('#dsub').textContent=STAGES[st][1]; $('#dtext').textContent=STAGES[st][2]; } }
  playBtn.addEventListener('click',function(){ if(A.progress>=1)A.progress=0; A.playing=!A.playing; A.dirty=true; ui(); });
  prog.addEventListener('input',function(){ A.progress=prog.value/1000; A.playing=false; A.dirty=true; ui(); });
  $('#speed').addEventListener('change',function(e){ A.speed=+e.target.value; }); $('#follow').addEventListener('change',function(e){ A.follow=e.target.checked; });
  function stopRec(){ if(A.rec&&A.rec.state!=='inactive')A.rec.stop(); }
  recBtn.addEventListener('click',function(){ if(A.rec){ stopRec(); return; } if(!p.canvas.captureStream||!window.MediaRecorder){ alert('此浏览器不支持 MediaRecorder'); return; }
    var mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm'; A.chunks=[];
    var rec=new MediaRecorder(p.canvas.captureStream(30),{mimeType:mime,videoBitsPerSecond:8e6}); A.rec=rec; rec.ondataavailable=function(e){ A.chunks.push(e.data); };
    rec.onstop=function(){ var blob=new Blob(A.chunks,{type:'video/webm'}); A.rec=null; recBtn.textContent='● 一键录制 WebM';
      var anchor=function(){ var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=RECNAME; a.click(); };
      if(window.claude&&window.claude.use)window.claude.use('downloads').then(function(dl){ return dl.save({filename:RECNAME,data:blob}).catch(function(e){ if(!e||e.code!=='declined')alert('保存失败:'+(e&&(e.message||e.code))); }); },anchor); else anchor(); };
    A.progress=0; A.drawn=0; base(); A.camX=SW-VW; A.follow=true; $('#follow').checked=true; A.playing=true; A.dirty=true; rec.start(); recBtn.textContent='■ 停止录制'; ui(); });
  window.addEventListener('keydown',function(e){ if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return; if(e.code==='Space'){ e.preventDefault(); playBtn.click(); } if(e.code==='ArrowLeft'){ A.camX=Math.max(0,A.camX-80); A.dirty=true; } if(e.code==='ArrowRight'){ A.camX=Math.min(SW-VW,A.camX+80); A.dirty=true; } });
  // ---------- p5 ----------
  // #full=1: the visible canvas is the whole scroll at 1:1 and the page chrome is hidden, so one screenshot holds every pixel
  var hp=new URLSearchParams(location.hash.slice(1)), full=hp.has('full');
  p.setup=function(){ if(full){ var m=$('main'); m.style.maxWidth='none'; m.style.padding='0'; $('#stage').style.border='none'; ['header','.bar','#steps','.desc','.note'].forEach(function(s){ var el=$(s); if(el)el.style.display='none'; }); p.createCanvas(SW,SH).parent('stage'); p.pixelDensity(1); A.progress=1; }
    else { p.createCanvas(VW,CH).parent('stage'); p.pixelDensity(2); }
    p.frameRate(30); A.g=p.createGraphics(SW,SH); A.g.pixelDensity(2); base();
    var seq=null; if(hp.has('p'))A.progress=Math.max(0,Math.min(1,+hp.get('p'))); if(hp.has('cam'))A.camX=Math.max(0,Math.min(1,+hp.get('cam')))*(SW-VW); if(hp.has('seq'))seq=hp.get('seq').split(',').map(Number);
    var loads=[document.fonts.load('13px "Ma Shan Zheng"',ALL_TEXT),document.fonts.load('13px "Noto Serif SC"',ALL_TEXT),document.fonts.load('13px "Kaiti SC"',ALL_TEXT)];
    Promise.all(loads).catch(function(){}).then(function(){ A.silkImg=bakeSilk(p,A.ctx); revealSilk(A.ctx,A.silkImg); build(); if(seq){ for(var i=0;i<seq.length;i++)syncTo(seq[i]); A.progress=seq[seq.length-1]; } ui(); }); ui(); };
  p.mousePressed=function(){ if(p.mouseX<0||p.mouseX>VW||p.mouseY<0||p.mouseY>CH)return; if(p.mouseY>VH+GAP){ A.dragging='mm'; A.camX=Math.max(0,Math.min(SW-VW,p.mouseX/VW*SW-VW/2)); A.dirty=true; } else { A.dragging='v'; A.dragX0=p.mouseX; A.camX0=A.camX; } };
  p.mouseDragged=function(){ if(A.dragging==='v'){ A.camX=Math.max(0,Math.min(SW-VW,A.camX0-(p.mouseX-A.dragX0))); A.dirty=true; } else if(A.dragging==='mm'){ A.camX=Math.max(0,Math.min(SW-VW,p.mouseX/VW*SW-VW/2)); A.dirty=true; } if(A.dragging)return false; };
  p.mouseReleased=function(){ A.dragging=null; };
  p.touchStarted=function(){ return p.mousePressed(); }; p.touchMoved=function(){ return p.mouseDragged(); }; p.touchEnded=function(){ return p.mouseReleased(); };
  var lastT=0;
  p.draw=function(){ var now=p.millis(), dt=Math.min(0.1,(now-lastT)/1000); lastT=now; if(!A.built)return;
    if(A.playing){ A.progress=Math.min(1,A.progress+dt*A.speed/A.T); if(A.follow)A.camX=(1-A.progress)*(SW-VW); if(A.progress>=1){ A.playing=false; stopRec(); } A.dirty=true; ui(); }
    if(!A.dirty)return; A.dirty=false; syncTo(A.progress);
    if(full){ p.image(A.g,0,0,SW,SH); return; }
    p.background('#14161B'); p.image(A.g,0,0,VW,VH,A.camX,0,VW,VH);
    p.image(A.g,0,VH+GAP,VW,MMH,0,0,SW,SH); p.noFill(); p.stroke(C.red[0],C.red[1],C.red[2]); p.strokeWeight(1.5); p.rect(A.camX/SW*VW,VH+GAP,VW/SW*VW,MMH);
    if(A.lastPos!==null&&A.progress<1){ p.noStroke(); p.fill(C.red[0],C.red[1],C.red[2]); p.circle(A.lastPos/SW*VW,VH+GAP-4,6); } };
}

// ---------- page title, written with the same brush engine; follows the page theme
new p5(function(q){ var inkC=[34,32,28];
  function readInk(){ var v=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim(), m=/^#([0-9a-f]{6})$/i.exec(v); if(m)inkC=[parseInt(m[1].slice(0,2),16),parseInt(m[1].slice(2,4),16),parseInt(m[1].slice(4,6),16)]; }
  q.setup=function(){ q.createCanvas(470,74).parent('ttl'); q.pixelDensity(2); q.noLoop(); readInk(); document.fonts.load('40px "Ma Shan Zheng"',TITLE_TEXT).catch(function(){}).then(function(){ q.redraw(); }); matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){ readInk(); q.redraw(); }); };
  q.draw=function(){ q.clear(); var sd=4242; var R2=function(){ sd|=0; sd=sd+0x6D2B79F5|0; var t=Math.imul(sd^sd>>>15,1|sd); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
    var B=makeBrushText(R2), T=B.brushText({text:TITLE_TEXT,x:24,y:40,size:40,font:'"Kaiti SC","STKaiti","KaiTi","Ma Shan Zheng"',horizontal:true,lineH:1.1,over:9,ink:0.95,dry:0.3,warp:0,tilt:0,wander:0});
    for(var i=0;i<T.length;i++)for(var j=0;j<T[i].comps.length;j++)B.stampDabs(q,T[i].comps[j],inkC); }; });
