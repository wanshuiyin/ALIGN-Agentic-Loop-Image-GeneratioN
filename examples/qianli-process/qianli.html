<title>千里江山圖 · 過程</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EDE6D6; --panel:#F6F1E4; --ink:#22211C; --ink-2:#5A574C; --ink-3:#8E8A7B; --rule:#D6CDB8;
  --azurite:#2E5D96; --cinnabar:#B9382A; --chip:#E4DCC7; --chip-on:#2E5D96; --chip-on-ink:#F6F1E4;
  --display:"Ma Shan Zheng","Noto Serif SC","Songti SC",serif;
  --serif:"Noto Serif SC","Songti SC","SimSun",serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161B; --panel:#1C1F26; --ink:#E8E1CF; --ink-2:#B5AE9B; --ink-3:#7D7869; --rule:#2C303A;
    --azurite:#6E9BD2; --cinnabar:#D9573F; --chip:#262A33; --chip-on:#6E9BD2; --chip-on-ink:#14161B;
  }
}
:root[data-theme="dark"]{
  --bg:#14161B; --panel:#1C1F26; --ink:#E8E1CF; --ink-2:#B5AE9B; --ink-3:#7D7869; --rule:#2C303A;
  --azurite:#6E9BD2; --cinnabar:#D9573F; --chip:#262A33; --chip-on:#6E9BD2; --chip-on-ink:#14161B;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.6;margin:0}
main{max-width:980px;margin:0 auto;padding:36px 24px 64px}
header{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;margin-bottom:16px}
h1.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#ttl{min-height:74px}#ttl canvas{display:block}
header p{margin:0;color:var(--ink-2);font-size:14px}
.stage-wrap{background:#14161B;border:1px solid var(--rule);border-radius:3px;overflow-x:auto;cursor:grab}
.stage-wrap:active{cursor:grabbing}
.stage-wrap canvas{display:block}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:12px 0 0;font-family:var(--mono);font-size:13px;color:var(--ink-2)}
button{font-family:var(--mono);font-size:13px;padding:6px 12px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);border-radius:3px;cursor:pointer}
button.primary{background:var(--azurite);color:var(--chip-on-ink);border-color:var(--azurite)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--cinnabar);outline-offset:2px}
select{font-family:var(--mono);font-size:13px;padding:5px 6px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);border-radius:3px}
input[type=range]{accent-color:var(--cinnabar)}
#prog{flex:1 1 260px;min-width:200px}
label{display:flex;align-items:center;gap:6px}
.steps{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:14px 0 0}
.steps button{padding:6px 2px;font-family:var(--serif);font-size:13px;line-height:1.2;background:var(--chip);border-color:transparent}
.steps button b{display:block;font-family:var(--mono);font-size:10px;font-weight:400;color:var(--ink-3);margin-bottom:2px}
.steps button.on{background:var(--chip-on);color:var(--chip-on-ink)}
.steps button.on b{color:var(--chip-on-ink);opacity:.8}
.desc{display:grid;grid-template-columns:150px 1fr;gap:20px;background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:18px 22px;margin-top:14px;min-height:120px}
.desc h2{font-family:var(--display);font-size:36px;font-weight:400;margin:0;line-height:1.15;letter-spacing:.04em}
.desc .sub{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.04em;margin-top:6px}
.desc p{margin:0;max-width:62ch;color:var(--ink-2);font-size:15px}
.desc p strong{color:var(--ink);font-weight:600}
.note{margin:22px 0 0;color:var(--ink-3);font-size:13.5px;max-width:74ch}
.note b{color:var(--ink-2);font-weight:600}
@media (max-width:720px){.steps{grid-template-columns:repeat(5,1fr)}.desc{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<main>
<header>
  <div id="ttl" aria-hidden="true"></div><h1 class="sr">千里江山圖 · 過程</h1>
  <p>北宋 · 王希孟 · 政和三年(1113)· 絹本設色 · 51.5 × 1191.5 cm · 故宮博物院藏。此卷為 p5.js 程序生成的意臨,按青綠山水的實際工序逐層畫出。</p>
</header>

<div class="stage-wrap" id="stage"></div>

<div class="bar">
  <button class="primary" id="play">▶ 播放</button>
  <label>速度 <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></label>
  <input type="range" id="prog" min="0" max="1000" value="0" aria-label="绘画进度">
  <output id="pct" style="min-width:4ch;color:var(--ink)">0%</output>
  <label><input type="checkbox" id="follow" checked> 镜头自右向左展卷</label>
  <button id="rec">● 一键录制 WebM</button>
</div>
<div class="steps" id="steps"></div>
<div class="desc"><div><h2 id="dname">矾绢</h2><div class="sub" id="dsub"></div></div><p id="dtext"></p></div>

<p class="note"><b>怎么看:</b>手卷自右向左展读,直接拖动画面或下方缩略图即可卷动;拖进度条可回到任何一道工序中间。空格键播放/暂停,← → 卷动。<b>录制:</b>点"一键录制"会从头播放并用 MediaRecorder 抓取画面,播完自动弹出 WebM 保存确认;把这个 HTML 文件在本地浏览器打开也能直接导出。</p>
</main>

<script>
/* 毛笔字引擎 v2:以行楷字体为底稿,把每个字重新"写"成墨点堆积。
   每个连通分量当作一"笔":沿主轴做粗细起伏与收锋,飞白顺主轴成丝,字内做 4–8% 骨架形变,字与字按 2–4 字一组起伏。
   所有随机在此处定死;stampDabs 只回放。 */
function makeBrushText(R){
  const rr=(a,b)=>a+R()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const cache=new Map();
  function glyph(ch,font,size,SS){
    const key=ch+font+size+SS; if(cache.has(key))return cache.get(key);
    const px=size*SS, W=Math.ceil(px*1.3), H=Math.ceil(px*1.3);
    const c=document.createElement('canvas'); c.width=W; c.height=H; const ctx=c.getContext('2d');
    ctx.fillStyle='#000'; ctx.font=`${px}px ${font}`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(ch,W/2,H/2);

    const D=new Float32Array(W*H); for(let i=0;i<W*H;i++)D[i]=mask[i]?1e6:0;
    for(let y=1;y<H;y++)for(let x=1;x<W-1;x++){ const i=y*W+x; if(!mask[i])continue; D[i]=Math.min(D[i],D[i-1]+3,D[i-W]+3,D[i-W-1]+4,D[i-W+1]+4); }
    for(let y=H-2;y>=0;y--)for(let x=W-2;x>=1;x--){ const i=y*W+x; if(!mask[i])continue; D[i]=Math.min(D[i],D[i+1]+3,D[i+W]+3,D[i+W-1]+4,D[i+W+1]+4); }
    const comp=new Int32Array(W*H).fill(-1); const comps=[]; const stack=[];
    for(let s=0;s<W*H;s++){ if(!mask[s]||comp[s]>=0)continue; const id=comps.length; const px_=[]; stack.push(s); comp[s]=id;
      while(stack.length){ const i=stack.pop(); px_.push(i); const x=i%W,y=(i/W)|0; for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+dx,ny=y+dy; if(nx<0||ny<0||nx>=W||ny>=H)continue; const j=ny*W+nx; if(mask[j]&&comp[j]<0){comp[j]=id;stack.push(j);} } }

      for(const i of px_){ const x=i%W-mx, y=((i/W)|0)-my; cxx+=x*x; cyy+=y*y; cxy+=x*y; }
      const ang=0.5*Math.atan2(2*cxy,cxx-cyy); const ux=Math.cos(ang), uy=Math.sin(ang);

    const items=[]; let load=1, sinceReload=0, nextReload=Math.floor(rr(3,8)), tone=rr(0.86,1);
    let gLeft=0, gMode=0;
    cols.forEach((col,ci)=>{ let cx=o.x+(o.dir||-1)*ci*(o.colGap||0); let cy=o.y; const wph=rr(0,6.3), wamp=WANDER*rr(0.7,1.3);
      col.forEach((ch,ri)=>{
        if(gLeft<=0){ gLeft=Math.floor(rr(2,5)); gMode=gMode?0:1; }
        gLeft--;
        if(sinceReload>=nextReload){ load=rr(0.9,1); sinceReload=0; nextReload=Math.floor(rr(3,8)); tone=rr(0.86,1); }
        if(ch===' '||ch==='·'){ if(ch==='·'){ items.push({x:cx,y:cy,ch,comps:[[{x:cx+(o.horizontal?size*0.45:0),y:cy+(o.horizontal?0:size*0.45),r:size*0.06,a:0.7}]],tone}); } const adv=size*(ch==='·'?0.75:0.3); if(o.horizontal)cx+=adv; else cy+=adv; return; }
        const G=glyph(ch,font,size,SS); const sc=rr(0.97,1.03), tilt=rr(-TILT,TILT)*Math.PI/180, dx=rr(-0.4,0.4)*Math.min(1,WANDER*2)+(o.horizontal?0:Math.sin(ri*0.7+wph)*wamp), dy=rr(-0.3,0.3)*Math.min(1,WANDER*2)+(o.horizontal?Math.sin(ri*0.9+wph)*WANDER*0.4:0);
        const inkG=gMode?0.86:1; const cosT=Math.cos(tilt), sinT=Math.sin(tilt);
        const k1=rr(0.5,0.9)*Math.PI*2/size, k2=rr(0.5,0.9)*Math.PI*2/size, p1=rr(0,6.3), p2=rr(0,6.3), wa=warpA*rr(0.8,1.3);
        let expect=0; for(const cp of G.comps)for(const i of cp.px){ const d=G.D[i]/3; if(d>=0.9){ const rs=d*0.86; expect+=Math.min(1,OVER/(Math.PI*rs*rs)); } }
        const decay=rr(0.08,0.16)/Math.max(1,expect);
        const comps=[];
        G.comps.forEach((cp,k)=>{
          const long=cp.len>size*SS*0.35;
          const f=rr(0.8,1.6), ph=rr(0,6.3), nb=long?Math.floor(rr(1,4)):0, bris=[]; for(let b=0;b<nb;b++)bris.push({off:rr(-0.8,0.8),w:rr(0.35,0.7),t0:rr(0.1,0.6),t1:rr(0.5,1)});
          const pts=cp.px.map(i=>{ const x=i%G.W,y=(i/G.W)|0; const t=((x-cp.mx)*cp.ux+(y-cp.my)*cp.uy-cp.tmin)/Math.max(1,cp.len), s=(-(x-cp.mx)*cp.uy+(y-cp.my)*cp.ux); return {x,y,d:G.D[i]/3,t,s}; }).filter(q=>q.d>=0.9).sort((a,b)=>a.t-b.t);
          const dabs=[];
          pts.forEach(q=>{ const t=clamp(q.t,0,1);
            let wmod=1+(long?0.42:0.18)*Math.sin(t*Math.PI*2*f+ph); if(long&&t>0.72)wmod*=1-0.5*(t-0.72)/0.28;
            wmod=clamp(wmod,0.55,1.45);
            const rs=q.d*0.86*wmod, density=Math.min(1,OVER/(Math.PI*rs*rs)); if(R()>density)return;
            load=Math.max(0.18,load-decay); const dry=(1-load)*DRY;
            let gap=false; for(const b of bris){ if(t>b.t0&&t<b.t1&&Math.abs(q.s/Math.max(1,q.d)-b.off)<b.w*(0.3+dry))gap=true; }
            if(gap&&dry>0.35&&R()<0.85*DRY)return; if(R()<dry*0.05*DRY)return;
            const entry=t<0.1?1+(0.1-t)*1.4:1, pool=k===0&&t<0.08?1.1:1;
            const ink=clamp(INK*inkG*tone*(0.62+0.38*load)*entry*rr(0.96,1.04),0.08,0.97), a=1-Math.pow(1-ink,1/OVER);
            const r=rs/SS*rr(0.92,1.08)*pool;
            let lx=(q.x-G.W/2)/SS*sc, ly=(q.y-G.H/2)/SS*sc; const wx=wa*Math.sin(ly*k1+p1), wy=wa*Math.sin(lx*k2+p2); lx+=wx; ly+=wy;
            const X=cx+dx+lx*cosT-ly*sinT, Y=cy+dy+lx*sinT+ly*cosT;
            dabs.push({x:X+rr(-0.1,0.1),y:Y+rr(-0.1,0.1),r:Math.max(0.3,r),a}); });
          if(dabs.length)comps.push(dabs); });
        sinceReload++; items.push({x:cx,y:cy,ch,comps,tone});
        const adv=size*(o.lineH||1.08)*rr(0.985,1.015); if(o.horizontal)cx+=adv; else cy+=adv; }); });

    for(const d of dabs){ ctx.beginPath(); if(d.r<1.1){ ctx.fillStyle=`rgba(${ink[0]},${ink[1]},${ink[2]},${d.a.toFixed(3)})`; ctx.arc(d.x,d.y,d.r,0,Math.PI*2); ctx.fill(); }
      else { const bleed=d.r*1.18; const gr=ctx.createRadialGradient(d.x,d.y,0,d.x,d.y,bleed); gr.addColorStop(0,`rgba(${ink[0]},${ink[1]},${ink[2]},${d.a.toFixed(3)})`); gr.addColorStop(0.62,`rgba(${ink[0]},${ink[1]},${ink[2]},${(d.a*0.8).toFixed(3)})`); gr.addColorStop(1,`rgba(${ink[0]},${ink[1]},${ink[2]},0)`); ctx.fillStyle=gr; ctx.arc(d.x,d.y,bleed,0,Math.PI*2); ctx.fill(); } }

<script>
const CW=185, PW=4000, SW=CW+PW, SH=500, VW=930, VH=500, MMH=Math.round(VW/SW*SH), GAP=12, CH=VH+GAP+MMH, YW=332;
const C={silk:[170,146,102], silkDk:[124,98,62], paper:[204,186,148], ink:[42,39,33], ochre:[176,130,80], ochre2:[150,104,60], zhilv:[108,138,82], shilv:[78,134,104], shilv2:[104,158,126],
  shiqing:[48,86,146], shiqing2:[78,118,176], shiqing3:[34,60,110], huaqing:[72,103,124], waterInk:[48,62,63], far:[112,132,156], red:[182,50,36], tree:[38,62,40], tree2:[58,92,54], trunk:[74,54,32]};
const STAGES=[
 ['矾绢','silk ground · 胶矾水','先在细绢上刷胶矾水(矾绢),使绢面不洇。绢本身是暖黄色,九百年氧化后偏深褐,这层底色会透过之后所有薄染的颜色。左端另接一段拖尾纸,留给题跋。'],
 ['勾勒','ink outline · 淡墨起稿','用淡墨勾出山石轮廓、峰峦脉络与曲折的岸线。线条瘦劲,山头尖峭、一面陡一面缓,是全卷的骨架;之后每一层颜色都顺着这些线来。'],
 ['皴擦','texture strokes · 披麻皴','从每个峰头向两侧分"道"向下放射短线,皴出山石的结构与向背:左侧背阴一面皴得密而重,右侧向阳一面留得空。近披麻皴一路,笔触松秀。'],
 ['赭石打底','ochre underpainting','山体普遍薄罩一层赭石,坡脚与峰瓣之间的谷口再加一遍;沙洲也在这一步铺赭。矿物色直接上绢会飘,先有赭石打底,青绿才沉得住、有暖意。'],
 ['汁绿·水色','vegetation green & water tint · 花青','用植物性的汁绿(花青调藤黄)统罩山体中下部,与赭石过渡;江面先薄罩花青,再罩一遍极淡汁绿,把黄绢压成冷灰绿的水色。'],
 ['石绿','malachite · 矿物石绿','矿物石绿分几次积染在每个峰瓣的下半面,颜料有颗粒,越积越厚、越亮。峰与峰之间的谷口只到半山就停,留着赭石。'],
 ['石青','azurite · 头青、二青','头青、二青沿每个峰头的脊线向下敷,主峰脊线可下到四成,向阳一面比背阴多敷一分。青与绿的边界跟着峰瓣走,不是一条水平线。'],
 ['水纹·远山','water lines & distant hills','以细笔勾网巾纹:一行行连续的波线,相邻两行错开半个波长,结成网;近处略密而重,远处略疏而淡,遇岸即止、近岸微弯。远山分三层,只用淡花青染出,无轮廓。'],
 ['复勾·点景','re-outline, moss dots & staffage','青绿上完后用淡墨把轮廓重新提一遍(复勾),沿山脊、脉络疏疏点苔;树分点叶、夹叶、松、柳四种,岸边柳与点叶为主,山腰夹叶,松只在岩脊高处;村落是有院墙的院落,门前小径爬向山腰;桥两端落在岸上;江上有篷船与渔舟。'],
 ['云气·题跋','mist as blank silk, seals & colophon','云气不是白颜料,是留白:在两峰鞍部和大山脚下以绢色薄罩,把山与山之间松开。画心之后的拖尾纸上录蔡京跋,记王希孟十八岁作此卷、徽宗亲授其法;最后钤印。']];
const COLOPHON='政和三年閏四月八日賜希孟年十八歲昔在畫學為生徒召入禁中文書庫數以畫獻未甚工上知其性可教遂誨諭之親授其法不踰半歲乃以此圖進上嘉之因以賜臣京謂天下士在作之而已';

new p5(p=>{
  let g, silkImg, strokes=[], stageStart=[], drawn=0, progress=0, playing=false, dirty=true, camX=SW-VW, follow=true, speed=1, T=120, built=false;
  let dragging=null, dragX0=0, camX0=0, lastPos=null, rec=null, chunks=[];
  const checkpoints=new Map(); let boundaries=new Set();
  let seed=20230904; const R=()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
  const rr=(a,b)=>a+R()*(b-a), ri=(a,b)=>Math.floor(rr(a,b+1)), col=(c,a)=>[c[0],c[1],c[2],a], clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), smoothstep=(a,b,v)=>{ const t=clamp((v-a)/(b-a),0,1); return t*t*(3-2*t); };
  const M=[], BARS=[], VILL=[];
  const S=STAGES.map(()=>[]);
  const add=(st,x,f)=>S[st].push({x,f});
  const poly=(g,pts,close)=>{ g.beginShape(); for(const q of pts)g.vertex(q[0],q[1]); g.endShape(close?g.CLOSE:undefined); };

          if(!sites.length)continue; sites.forEach(v=>compound(v[0],v[1],rr(0.82,1.08),dir)); for(let i=0;i<ri(6,11);i++)shoreTree(x+rr(-30,30+n*36),y+rr(-3,4)); footpath(m,k,x-14*dir,m.field(x).lobe.px); break; } }
    });
    // waterfalls: blank silk core with two faint ink edges, then a stream to the bank
    M.filter(m=>!m.far&&m.lobes.length>=2&&m.hmax>110).slice(0,7).forEach(m=>{ const k=M.indexOf(m), i=ri(0,m.lobes.length-2), vx=m.lobes[i].R, vy=m.r(vx); const fallH=m.bank(vx)-vy; if(!m.lobes[i].visible||fallH<24||hiddenBy(k,vx,vy+8))return; const yEnd=vy+fallH*rr(0.45,0.7);
      const pts=[]; for(let y=vy+3;y<yEnd;y+=4){ const xx=vx+Math.sin(y*0.2)*0.8; if(hiddenBy(k,xx,y))break; pts.push([xx,y]); } if(pts.length<3)return; const s2=[[vx,yEnd],[vx+4,yEnd+6],[vx-5,yEnd+13],[vx+2,m.bank(vx)-2]];

    // bridges: land – water gap of 80–170 px – land
    { const found=[]; for(let y=YW+12;y<YW+60&&found.length<3;y+=6){ let land=landAt(X0,y), start=null; for(let x=X0;x<X1;x+=4){ const l=landAt(x,y); if(land&&!l)start=x; if(!land&&l&&start!==null){ const L=x-start; if(L>=80&&L<=170&&!found.some(f=>Math.abs(f[0]-start)<300&&Math.abs(f[1]-y)<40)){ let ok=landAt(start-8,y)&&landAt(x+8,y); for(let t=start+6;t<x-6;t+=6)if(landAt(t,y-8)||landAt(t,y+8))ok=false; if(ok)found.push([start-8,y,L+16]); } start=null; } land=l; } }
      found.forEach(([x,y,L],bi)=>{ for(let s=0;s<L;s+=50){ const a=x+s,b=Math.min(x+L,a+50); add(8,a,g=>{ g.stroke(...col(C.ink,190)); g.strokeWeight(0.75); g.line(a,y,b,y); g.line(a,y-3,b,y-3); for(let t=a;t<b;t+=24)if(t>x+4&&t<x+L-4){ g.line(t-2,y,t-3,y+6); g.line(t+2,y,t+3,y+6); g.line(t-3,y+6,t+3,y+6); } for(let t=a;t<b;t+=12){ g.line(t,y-3,t,y-6); } }); }
        if(bi===0){ const cx=x+L/2; add(8,cx,g=>{ g.stroke(...col(C.ink,190)); g.strokeWeight(0.6); g.fill(...col(C.silk,225)); g.rect(cx-8,y-10,16,7); g.noStroke(); g.fill(62,58,48,190); g.quad(cx-11,y-10,cx+11,y-10,cx+7,y-14,cx-7,y-14); g.quad(cx-6,y-14,cx+6,y-14,cx+3,y-18,cx-3,y-18); }); } }); }
    // boats: a third near villages, the rest on open water
    { const boat=(x,y,s,dir,fisher)=>add(8,x,g=>{ g.push(); g.translate(x,y); g.scale(dir,1); g.noFill(); g.stroke(...col(C.ink,205)); g.strokeWeight(0.62); g.bezier(-11*s,0,-7*s,4*s,8*s,4*s,12*s,0); g.line(-11*s,0,12*s,0);
        if(!fisher){ g.fill(...col(C.silk,210)); g.quad(-4*s,-1*s,5*s,-1*s,4*s,-5*s,-3*s,-5*s); g.noFill(); g.line(-5*s,-5*s,6*s,-5*s); g.line(-3*s,-7*s,4*s,-7*s); g.line(-3*s,-7*s,-5*s,-5*s); g.line(4*s,-7*s,6*s,-5*s); g.line(9*s,-1*s,15*s,-6*s); }
        else { g.strokeWeight(1.1); g.point(-3*s,-3*s); g.strokeWeight(0.55); g.line(-3*s,-2*s,-1*s,-6*s); g.line(-1*s,-6*s,-14*s,-3*s); g.line(6*s,0,10*s,-5*s); }
        g.stroke(...col(C.far,80)); g.strokeWeight(0.42); g.bezier(-14*s,3*s,-8*s,5*s,-3*s,4*s,1*s,4*s); g.bezier(5*s,4*s,10*s,4*s,14*s,3*s,18*s,2*s); g.pop(); });
      let n=0,tries=0; while(n<13&&tries<400){ tries++; let x,y; if(n<5&&VILL.length){ const v=VILL[ri(0,VILL.length-1)]; x=v[0]+rr(-160,160); y=v[1]+rr(14,60); } else { x=rr(X0,X1); y=rr(YW+26,SH-14); }
        if(y<YW+20||y>SH-8||!clearStaffWater(x,y,16))continue; boat(x,y,rr(0.45,1.25),flip(),R()<0.5); n++; } }
    // ---------------- stage 9: mist as silk, seals, colophon
    const silkMist=(m,k,x0,x1,y,phase,foot)=>{ const spec=foot?[[18,18],[12,23],[6,28]]:[[15,20],[9,25],[4.5,30]]; for(const [sw,al] of spec){ let run=[]; const fl=()=>{ if(run.length>2)pline(9,(run[0][0]+run[run.length-1][0])/2,C.silk,al,sw,run,true); run=[]; };
      for(let x=x0;x<=x1;x+=8){ const u=(x-x0)/(x1-x0), taper=Math.pow(Math.sin(Math.PI*u),0.65), yy=y+Math.sin(u*Math.PI*2+phase)*3*taper+Math.sin(u*Math.PI*5+phase*0.6)*0.8; if(hiddenBy(k,x,yy)||hiddenBy(k,x,yy-sw*0.55)||hiddenBy(k,x,yy+sw*0.55))fl(); else run.push([x,yy]); } fl(); } };
    M.forEach((m,k)=>{ if(m.far)return; for(let i=0;i<m.lobes.length-1;i++){ if(R()<0.4)continue; const sx=m.lobes[i].R, L=rr(70,180); silkMist(m,k,sx-L/2,sx+L/2,m.r(sx)+rr(8,18),rr(0,6),false); }
      if(m.hmax>150&&R()<0.8){ const L=rr(140,300), cx=m.x0+(m.x1-m.x0)*rr(0.25,0.75); silkMist(m,k,cx-L/2,cx+L/2,m.bank(cx)-rr(4,10),rr(0,6),true); } });
    const sealStamp=(st,x,y,sz,text)=>{ const rot=rr(-3,3)*Math.PI/180, offs=[[0,0],[rr(-0.8,0.8),rr(-0.8,0.8)],[rr(-0.8,0.8),rr(-0.8,0.8)]], chips=[]; for(let i=0;i<30;i++){ const px=rr(-0.5,0.5)*sz, py=rr(-0.5,0.5)*sz; if(Math.abs(px)>sz*0.4||Math.abs(py)>sz*0.4)chips.push([px,py,rr(0.5,1.6)]); }

        chars.forEach((ch,i)=>{ const cx=chars.length>2?(i%2===0?0.5:-0.5)*cell:0, cy=chars.length>2?(i<2?-0.5:0.5)*cell:(i===0?-0.5:0.5)*cell; c.fillText(ch,cx,cy+1); });
        c.fillStyle='rgba(214,196,160,0.75)'; for(const q of chips){ c.beginPath(); c.arc(q[0],q[1],q[2],0,Math.PI*2); c.fill(); } c.restore(); }); };
    // colophon paper (left): Cai Jing's colophon written stroke by stroke with the brush engine, right to left
    { const B=makeBrushText(R), per=14, colGap=24, x0=CW-32;   // 78 characters → 6 columns of 14, 6×24 = 144 px inside a 185 px sheet
      const items=B.brushText({text:COLOPHON,x:x0,y:50,size:18,font:'"Xingkai SC","Ma Shan Zheng"',colGap,perCol:per,dir:-1,over:6,ink:0.82,wander:0.3});
      for(const it of items)add(9,it.x,g=>{ for(const c of it.comps)B.stampDabs(g,c,C.ink); });
      const xl=x0-(Math.ceil(COLOPHON.length/per)-1)*colGap, yEnd=50+(COLOPHON.length-(Math.ceil(COLOPHON.length/per)-1)*per)*18*1.08; sealStamp(9,xl-10,yEnd+14,20,'蔡京'); sealStamp(9,xl-8,yEnd+42,16,'元長');

    let idx=0; S.forEach((arr,i)=>{ arr.sort((a,b)=>b.x-a.x); stageStart[i]=idx; for(const s of arr)strokes.push(s); idx+=arr.length; }); stageStart.push(idx);

  }
  function bakeSilk(){ silkImg=p.createGraphics(SW,SH); silkImg.pixelDensity(2); const s=silkImg; s.background(...C.silk);
    s.noStroke(); s.fill(...col(C.paper,255)); s.rect(0,0,CW,SH);
    const ctx=s.drawingContext, pd=2, w=SW*pd, h=SH*pd; const img=ctx.getImageData(0,0,w,h), d=img.data; let sd=99; const rn=()=>{ sd|=0; sd=sd+0x6D2B79F5|0; let t=Math.imul(sd^sd>>>15,1|sd); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };

    s.strokeWeight(0.3); s.stroke(...col(C.silkDk,7)); for(let x=0;x<SW;x+=1.3)s.line(x+(x%2.6<1.3?0.15:0),0,x,SH); s.stroke(...col(C.silkDk,4)); for(let y=0;y<SH;y+=1.6)s.line(0,y,SW,y+rr(-0.3,0.3));
    s.stroke(...col(C.silkDk,3)); s.strokeWeight(0.3); for(let i=0;i<12000;i++){ const x=R()*SW, y=R()*SH, L=rr(8,40); s.line(x,y,x+L,y); }
    for(let i=0;i<9;i++){ const x=R()*SW, y=R()*SH, r=rr(400,900); const g0=ctx.createRadialGradient(x*pd,y*pd,0,x*pd,y*pd,r*pd); const tn=R()<0.6?'90,70,40':'230,210,170'; g0.addColorStop(0,`rgba(${tn},0.09)`); g0.addColorStop(1,`rgba(${tn},0)`); ctx.fillStyle=g0; ctx.fillRect((x-r)*pd,(y-r)*pd,r*2*pd,r*2*pd); }

  const base=()=>{ g.push(); g.background(...C.silk); g.pop(); };

  // ---------- UI ----------
  const $=s=>document.querySelector(s); const playBtn=$('#play'), prog=$('#prog'), pct=$('#pct'), stepsEl=$('#steps');

    if(lastPos!==null&&progress<1){ p.noStroke(); p.fill(...C.red); p.circle(lastPos/SW*VW,VH+GAP-4,6); } };
});
