<script>
// p5.js-svg 1.5.1 with p5 1.9.4: p5's Renderer2D constructor is a transpiled class whose super() call
// returns a NEW object (Reflect.construct); p5.svg calls it with .call(this) and keeps `this`, which
// then has no drawingContext. Wrap RendererSVG so the object p5 actually built is the one returned.
(function () {
  const OrigSVG = p5.RendererSVG;
  p5.RendererSVG = function (elt, pInst, isMain) {
    const R2D = p5.Renderer2D; let made = null;
    const Tmp = function () { made = R2D.apply(this, arguments); return made; };
    Tmp.prototype = R2D.prototype; p5.Renderer2D = Tmp;
    let shell; try { shell = new OrigSVG(elt, pInst, isMain); } finally { p5.Renderer2D = R2D; }
    Object.setPrototypeOf(made, OrigSVG.prototype);
    made.isSVG = shell.isSVG; made.svg = shell.svg;
    // svgcanvas has no ctx.ellipse (p5 1.9 draws circle/arc through it): sample the arc into a path
    const ctxProto = Object.getPrototypeOf(made.drawingContext);
    if (!ctxProto.ellipse) ctxProto.ellipse = function (x, y, rx, ry, rot, a0, a1, ccw) {
      rot = rot || 0; if (a0 === undefined) { a0 = 0; a1 = Math.PI * 2; }
      const TAU = Math.PI * 2; let span = a1 - a0;
      if (!ccw) { if (span < 0) span += TAU * Math.ceil(-span / TAU); if (span > TAU) span = TAU; }
      else { if (span > 0) span -= TAU * Math.ceil(span / TAU); if (span < -TAU) span = -TAU; }
      const n = Math.max(8, Math.ceil(Math.abs(span) / TAU * 72));
      for (let i = 0; i <= n; i++) { const a = a0 + span * i / n, px = rx * Math.cos(a), py = ry * Math.sin(a);
        const X = x + px * Math.cos(rot) - py * Math.sin(rot), Y = y + px * Math.sin(rot) + py * Math.cos(rot);
        if (i === 0) this.moveTo(X, Y); else this.lineTo(X, Y); }
    };
    return made;
  };
  p5.RendererSVG.prototype = OrigSVG.prototype;
})();
</script>

<script>
window.addEventListener('error', e => { document.getElementById('err').textContent += e.message + ' @' + (e.filename||'').split('/').pop() + ':' + e.lineno + '\n'; });
// ALIGN Figure 1, v6 — one program, in the project's own ink on silk (D-14). Every mark is {stage, x, draw(g, t)};
// everything is decided at build time (rects, routes, stroke outlines, label widths); draw() only replays.
// Round 4 applied D-16 (a stroke is one filled outline), D-17 (audit 2 px), D-18 (✗ → ✓ pairs), D-19 (band 3 grows),
// D-20 (no eave overhang), D-21 (one caption), D-22 (the full name and "without diffusion" in the title strip).
// Round 5 applies D-16 amended (directional dashes; long shafts thin along the body), D-23 (a) (the booklet among the motifs),
// D-24 (the stop line), D-25 (the scene splits: mountain on the source side, the bridge passage on the work side; icon lines 2.0 / 1.4 at α 0.6),
// D-26 (the eye at icon size, opaque; A8 stops at its edges).
// Round 6 applies D-17's closing checklist: role tags (executor · Claude, reviewer · Codex, user at the eye); the seal's three exits each a short
// labelled path (accept → the 赭石 repaint lane, overrule = the 花青 dashed line entering, revert → the kept versions in band 3); a 淡墨 line from
// 卷宗 down to 版本 "one version per round"; the rule panel's hierarchy swapped (the stop line bold at 28, the DRIVE/ACQUIT sentence a 22 note);
// the brush profile in three pieces visible at 1× (thin start → 顿 · even body · tapered 收笔); each arrow ends in a short filled brush wedge;
// the row of eleven kept versions in band 3's right. Also D-28 (the inspected window at the reference's size) and D-29 (a seal mark at the colophon's foot).
const W = 1800, H = 1000;
const KAI = 'ALIGKai', SANS = 'ALIGSans', SEAL = 'ALIGSeal';       // @font-face aliases; the SVG export rewrites them to full stacks
const STACK = {
  ALIGKai:  '"Kaiti SC","STKaiti","Noto Serif SC","Songti SC","Noto Serif CJK SC",serif',
  ALIGSans: '"Optima","Seravek","Gill Sans","Source Sans 3","Fira Sans","Lucida Grande","Helvetica Neue",Helvetica,"Kaiti SC","STKaiti","Noto Serif SC",sans-serif',
  ALIGSeal: '"Heiti SC","PingFang SC","Songti SC","Noto Sans SC",sans-serif',

const STAGES = ['色带', '框', '箭头', '白描', '文字', '图例'];
const S0 = 52, S1 = 36, S2 = 28, S3 = 22;                          // four sizes (D-04 amended in D-14); nothing smaller than 22

const INK = [43, 38, 32], OCHRE = [168, 112, 62], HUAQING = [74, 106, 134], ZHUSHA = [176, 57, 42], SHILV = [95, 154, 110];

const KIND = {   // the four line kinds by meaning: width, colour, alpha, head length (D-17: audit 2 px, α 0.6, head 10)
  flow:     { w: 5,   col: INK,     a: 1,    head: 18 },
  repaint:  { w: 3.5, col: OCHRE,   a: 1,    head: 12 },
  overrule: { w: 3,   col: HUAQING, a: 1,    head: 12, dash: [10, 8] },
  audit:    { w: 2,   col: INK,     a: 0.6,  head: 10 },

const T = {};            // p5.Image by name (the one raster), loaded once from a data URI
let MARKS = null;        // built once, shared by the canvas and the SVG instance
let P = 1;               // progress 0..1
let main = null, svgInst = null;

// ---------- one seeded PRNG (seed 7), consumed at build in unit order; draw() never calls it (G-01) ----------
let seed = 7;

function hash1(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

const dist = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]);
function resample(pts, step) {   // linear, ~step px, keeps every input vertex
  step = step || 2; const out = [pts[0]];
  for (let i = 1; i < pts.length; i++) { const d = dist(pts[i-1], pts[i]), n = Math.max(1, Math.round(d / step));
    for (let k = 1; k <= n; k++) out.push([pts[i-1][0] + (pts[i][0] - pts[i-1][0]) * k / n, pts[i-1][1] + (pts[i][1] - pts[i-1][1]) * k / n]); }
  return out;
}

  step = step || 2; if (pts.length < 3) return resample(pts, step);
  const P = [pts[0]].concat(pts, [pts[pts.length - 1]]), out = [pts[0]];
  for (let i = 1; i < P.length - 2; i++) { const p0 = P[i-1], p1 = P[i], p2 = P[i+1], p3 = P[i+2];
    const n = Math.max(2, Math.round(dist(p1, p2) / step));
    for (let k = 1; k <= n; k++) { const t = k / n, t2 = t * t, t3 = t2 * t;
      out.push([0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
                0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)]); } }
  return out;
}
function fillet(pts, r) {        // a routed path with right-angle corners: round each interior corner with radius r
  if (pts.length < 3) return pts; const out = [pts[0]];
  for (let i = 1; i < pts.length - 1; i++) { const a = pts[i-1], b = pts[i], c = pts[i+1];
    const la = dist(a, b), lc = dist(b, c), rr = Math.min(r, la / 2, lc / 2);
    const p = [b[0] + (a[0] - b[0]) / la * rr, b[1] + (a[1] - b[1]) / la * rr], q = [b[0] + (c[0] - b[0]) / lc * rr, b[1] + (c[1] - b[1]) / lc * rr];
    out.push(p); for (let k = 1; k < 6; k++) { const t = k / 6, u = 1 - t; out.push([u*u*p[0] + 2*u*t*b[0] + t*t*q[0], u*u*p[1] + 2*u*t*b[1] + t*t*q[1]]); } out.push(q); }

}
function arcPts(cx, cy, r, a0, a1, n) { const out = []; n = n || Math.max(8, Math.round(Math.abs(a1 - a0) * r / 2)); for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; out.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); } return out; }

function bezPts(p0, p1, p2, p3, n) { const out = []; for (let i = 0; i <= n; i++) { const t = i / n, u = 1 - t; out.push([u*u*u*p0[0] + 3*u*u*t*p1[0] + 3*u*t*t*p2[0] + t*t*t*p3[0], u*u*u*p0[1] + 3*u*u*t*p1[1] + 3*u*t*t*p2[1] + t*t*t*p3[1]]); } return out; }
function polyLen(pts) { let L = 0; for (let i = 1; i < pts.length; i++) L += dist(pts[i-1], pts[i]); return L; }
function pointAt(pts, s) {
  let acc = 0;
  for (let i = 1; i < pts.length; i++) { const d = dist(pts[i-1], pts[i]);
    if (s <= acc + d || i === pts.length - 1) { const f = d ? clamp((s - acc) / d, 0, 1) : 0; return [pts[i-1][0] + (pts[i][0] - pts[i-1][0]) * f, pts[i-1][1] + (pts[i][1] - pts[i-1][1]) * f]; }
    acc += d; }
  return pts[pts.length - 1];
}
function subPoly(pts, a, b) {
  const out = [pointAt(pts, a)]; let acc = 0;
  for (let i = 1; i < pts.length; i++) { const d = dist(pts[i-1], pts[i]); if (acc + d > a && acc + d < b) out.push(pts[i]); acc += d; }
  out.push(pointAt(pts, b)); return out;
}

// ---------- the brush (D-16): one stroke = one filled outline — the two offset edges of its width profile, closed ----------
// pts: a dense polyline (~2 px). Width factor along t = s/L by style:
//  'brush' — thin 起笔 swelling to 1.6 w, settling to an even body, then 收笔 to 0.08 w;
//            a corner carries a short press. The arrow's final mark is a filled brush wedge.
//  'heng'  — a 横 (the eave): a 顿 at both ends (1.15), a body at 0.95 ±6 %
//  'line'  — icon line work: 1.12 → 1.0 at the start, ±8 % body, a 收笔 to 0.55
//  'pie'   — 撇: the head's two strokes, the ✗: 0.85 → 1.25 over the first 22 % (pressed at the apex), then a taper to 0.20
//  'dash'  — one dash of the overrule: a 顿 over its first fifth, then a taper to a point — a brush mark travelling one way (D-16 amended)
//  'rule'  — constant width, stroked, no head or tail (panel outlines, ticks, the scrub bar, the ledger rule) — not the tell
function strokeGeom(pts, w, style, corners) {
  const n = pts.length; if (n < 2) return null; const s = [0]; let L = 0;
  for (let i = 1; i < n; i++) { L += dist(pts[i-1], pts[i]); s.push(L); }
  if (L < 0.3) return null;
  const ph = R() * 200, tiny = L < 6;
  const nz = sv => clamp((noise1(ph + sv * 0.03) - 0.5) / 0.3, -1, 1);
  const prof = (t, sv) => {
    if (tiny) return 1;
    if (style === 'heng') { let m = 0.95; if (t < 0.10) m = 1.15 - 0.20 * smoothstep(t / 0.10); else if (t > 0.90) m = 0.95 + 0.20 * smoothstep((t - 0.90) / 0.10); return m * (1 + 0.06 * nz(sv)); }
    if (style === 'line') { let m = 1; if (t < 0.12) m = 1.12 - 0.12 * smoothstep(t / 0.12); else if (t > 0.80) m = 1 - 0.45 * smoothstep((t - 0.80) / 0.20); return m * (1 + 0.08 * nz(sv)); }
    if (style === 'pie') return (t < 0.22 ? 0.85 + 0.40 * smoothstep(t / 0.22) : 1.25 - 1.05 * smoothstep((t - 0.22) / 0.78)) * (1 + 0.05 * nz(sv));
    if (style === 'dash') { const td = Math.min(w * 1.2, L * 0.5) / L;   // the 顿 is a length of ink (≈ 1.2 w), then a taper to a point: one direction (D-16 amended, round 5)
      return t < td ? 0.75 + 0.40 * smoothstep(t / td) : 1.15 - 1.05 * smoothstep((t - td) / (1 - td)); }
    // D-17 (5): three readable pressures, including on the short panel-to-panel strokes.
    const dun = Math.min(L * 0.30, w * 5), td = dun / L, tail = Math.min(L * 0.30, w * 8), tt = 1 - tail / L;
    let m = 1;
    if (t < td * 0.4) m = 0.24 + 1.36 * smoothstep(t / (td * 0.4));
    else if (t < td) m = 1.6 - 0.6 * smoothstep((t - td * 0.4) / (td * 0.6));
    else if (t > tt) m = 1 - 0.92 * smoothstep((t - tt) / (1 - tt));
    if (corners) for (const sc of corners) { const d = sv - sc; let b = 0;   // the 折: a press over the fold
      if (d < 0 && d > -2 * w) b = smoothstep((d + 2 * w) / (2 * w)); else if (d >= 0 && d < 3 * w) b = 1 - smoothstep(d / (3 * w));

    let dx = b[0] - a[0], dy = b[1] - a[1]; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
    const h = Math.max(0.12, w * prof(s[i] / L, s[i]) / 2); hw.push(h); dir.push([dx, dy]);
    left.push([pts[i][0] - dy * h, pts[i][1] + dx * h]); right.push([pts[i][0] + dy * h, pts[i][1] - dx * h]);
  }

  const cap = (i, back) => { const c = pts[i], r = hw[i], a0 = Math.atan2(dir[i][1], dir[i][0]) + (back ? Math.PI : 0); return arcPts(c[0], c[1], r, a0 - Math.PI / 2, a0 + Math.PI / 2, 6); };

}
// fillGeom draws the stroke's outline between arclengths a and b (flat cuts inside the stroke, the round caps only at its true ends);
// breaks: arclength ranges left blank where the stroke passes behind another — the profile runs on as if unbroken
function fillGeomRange(cx, gm, css, a, b) {
  const edgeAt = (sv, side) => { let k = 0; while (k + 1 < gm.s.length && gm.s[k + 1] <= sv) k++;
    if (k + 1 >= gm.s.length) return side[gm.s.length - 1];
    const s0 = gm.s[k], s1 = gm.s[k+1], f = s1 > s0 ? (sv - s0) / (s1 - s0) : 0; return [side[k][0] + (side[k+1][0] - side[k][0]) * f, side[k][1] + (side[k+1][1] - side[k][1]) * f]; };

  else { const eR = edgeAt(a, gm.right), eL = edgeAt(a, gm.left); cx.moveTo(eR[0], eR[1]); cx.lineTo(eL[0], eL[1]); }
  if (i0 >= 0) for (let i = i0; i < i1; i++) cx.lineTo(gm.left[i][0], gm.left[i][1]);
  if (endCap) for (const p of gm.cap1) cx.lineTo(p[0], p[1]);
  else { const eL = edgeAt(b, gm.left), eR = edgeAt(b, gm.right); cx.lineTo(eL[0], eL[1]); cx.lineTo(eR[0], eR[1]); }

  let ranges = [[0, end]];
  for (const [ga, gb] of (breaks || [])) { const next = [];

  // A11 audit (D-01 amended, D-17): 盲评's bottom → the lane above the repaint's → right → up into the wiki's bottom, left of the repaint's drop; broken where the two exits pass
  add(2, 10003, arrow([[1120, Pn.review.b], [1120, AUDIT_Y], [1640, AUDIT_Y], [1640, Pn.wiki.b]], 'audit',
    { breaks: [brk((AUDIT_Y - Pn.review.b) + (ACCEPT_X - 1120), 6), brk((AUDIT_Y - Pn.review.b) + (REVERT_X - 1120), 6)] }));
  // D-17 (3): the wiki records one version each round. Its outer drop clears the

  // D-23 (a): the 规格 booklet recurs at the left of 模块's icon area — the contract the owners build against — the four motifs in a 2 × 2 of 40-px cells to its right
  { const y = P2.y + 76, k = 40 / 44, bx = 282, gx = 330;
    const ms = [booklet(bx, y + 30, 40 / 60), motif('roof', gx, y, k), motif('boat', gx + 48, y, k), motif('tree', gx, y + 48, k), motif('water', gx + 48, y + 48, k)];
    whole(3, bx, g => ms.forEach(d => d(g))); }
  whole(3, 540, codeSheet(540, P2.y + 74, 70, 96, 6));
  whole(3, 764, renderFrames(764, P2.y + 68, 92, 62, P2.y + 142));
  whole(3, 976, figureScene(P2.y));
  whole(3, EYE.cx - EYE_RX, eyeIcon(EYE.cx, EYE.cy));
  whole(3, 1575, scrollIcon(1575, P2.y + 88));
  whole(3, 300, replayIcon(300, P3.y + 66));
  whole(3, 612, versionsIcon([612, 692, 772], P3.y + 66));
  // D-17 (6): band 3's right — a row of eleven kept versions, v1 … v11, the last filled
  { const vr = VROW, f = [];
    vr.xs.forEach((x, i) => { if (i === vr.xs.length - 1) f.push(g => fillRect(g, x, vr.y, vr.s, vr.s, C.ink)); else { f.push(g => fillRect(g, x, vr.y, vr.s, vr.s, C.paper)); f.push(rectRule(x, vr.y, vr.s, vr.s, 1.5)); } });
    whole(3, vr.xs[0], g => f.forEach(d => d(g))); }

  // ---- 5 文字 ---- arrow labels, glyph labels, tags, the outcomes line
  whole(4, labelX - lw / 2, g => txt(g, repaintLabel, labelX, REPAINT_Y + 6, S3, SANS, g.BOLDITALIC, C.ochre, g.CENTER));
  whole(4, 1400, g => txt(g, 'reference', 1548, REF.y + 32, S3, SANS, g.NORMAL, C.huaqing, g.RIGHT));
  whole(4, 130, g => txt(g, 'executor · Claude', 130, KB[1] + 28 + 24, S3, SANS, g.NORMAL, rgba(INK, 0.45), g.CENTER));
  // D-17 (2): one word at each exit, in the colour of its path — overrule beside the dashed drop above the seal, accept and revert beside their drops below it
  whole(4, SEALC[0] + 12, g => txt(g, 'overrule', SEALC[0] + 12, OVERRULE_Y + 44, S3, SANS, g.ITALIC, C.huaqing));
  whole(4, ACCEPT_X - 80, g => txt(g, 'accept', ACCEPT_X - 8, AUDIT_Y - 16, S3, SANS, g.ITALIC, C.ochre, g.RIGHT));
  whole(4, REVERT_X + 8, g => txt(g, 'revert', REVERT_X + 8, AUDIT_Y - 16, S3, SANS, g.ITALIC, rgba(INK, 0.6)));
  whole(4, verLabelX, g => txt(g, verLabel, verLabelX, VERSION_Y + 6, S3, SANS, g.NORMAL, rgba(INK, 0.6), g.CENTER));
  // D-17 (6): v1 and v11 under the row's ends (marks, as D-19 was), the caption under the row
  whole(4, VROW.xs[0], g => { txt(g, 'v1', VROW.xs[0] + VROW.s / 2, VROW.y + VROW.s + 24, S3, SANS, g.NORMAL, rgba(INK, 0.85), g.CENTER);
    txt(g, 'v11', VROW.xs[VROW.xs.length - 1] + VROW.s / 2, VROW.y + VROW.s + 24, S3, SANS, g.NORMAL, rgba(INK, 0.85), g.CENTER);
    txt(g, 'every version kept', VROW.cx, VROW.y + VROW.s + 56, S3, SANS, g.NORMAL, rgba(INK, 0.85), g.CENTER); });
  whole(4, 1418, g => txt(g, 'user', EYE.cx, EYE.cy - EYE_RY - 9, S3, SANS, g.NORMAL, rgba(INK, 0.45), g.CENTER));
  whole(4, 1000, g => txt(g, 'never the code', 1072, Pn.review.b - 16, S3, SANS, g.NORMAL, C.ink, g.CENTER));

  // ---- 6 图例 ---- legend → rule panel (D-18: a ✗ → ✓ pair; D-24: the stop line) → the showcase strip → one caption (D-21)
  const legend = ['flow', 'repaint', 'overrule', 'audit'];
  legend.forEach((k, i) => { const y = LEGEND_Y[i], a = arrow([[44, y], [104, y]], k); add(5, i * 0.01, (g, t) => { if (t < 1) return; a(g, 1); txt(g, k, 118, y + 7, S3, SANS, g.NORMAL, C.ink); }); });
  { const rp = PANELS.rule, d = panel(g, rp);
    // D-17 (4): the stop line is the panel's main sentence at 28 — ✓ reviewer · ✓ user → stop — the two ✓ drawn 石绿 strokes, the → a drawn brush arrow;
    // under it, at 22, the note that says why one tick cannot: a loop can DRIVE, cannot ACQUIT. The ✗ → ✓ example line is cut (its consequence is now drawn at the seal).
    const mw = s => measure(g, s, S2, SANS, g.BOLD), k = S2 / S3;
    const wTot = 26 * k + mw('reviewer') + 8 * k + mw('·') + 10 * k + 26 * k + mw('user') + 12 * k + S2 + 12 * k + mw('stop');
    const stopLine = bl => { const cy = bl - 7 * k; let x = rp.cx - wTot / 2;
      const c1 = checkMark(x + 9 * k, cy, k); x += 26 * k; const xA = x; x += mw('reviewer') + 8 * k; const xDot = x; x += mw('·') + 10 * k; const c2 = checkMark(x + 9 * k, cy, k); x += 26 * k; const xB = x; x += mw('user') + 12 * k;
      const ar = inlineArrow(x, bl, S2, INK); x += S2 + 12 * k; const xC = x;
      return gg => { c1(gg); txt(gg, 'reviewer', xA, bl, S2, SANS, gg.BOLD, C.ink); txt(gg, '·', xDot, bl, S2, SANS, gg.BOLD, C.ink); c2(gg); txt(gg, 'user', xB, bl, S2, SANS, gg.BOLD, C.ink); ar(gg); txt(gg, 'stop', xC, bl, S2, SANS, gg.BOLD, C.ink); }; };
    const l1 = stopLine(rp.y + 86);
    whole(5, 1, g => { d(g); l1(g); txt(g, 'a loop can DRIVE, cannot ACQUIT', rp.cx, rp.y + 132, S3, SANS, g.NORMAL, rgba(INK, 0.85), g.CENTER); }); }
  { const mount = rectRule(STRIP.x - 4, STRIP.y - 4, STRIP.w + 8, STRIP.h + 8, 1, INK, 0.45), im = T.showcase;
    const s = im ? STRIP.w / im.width : 1, sh = im ? Math.min(im.height, STRIP.h / s) : 0, sy = im ? (im.height - sh) / 2 : 0;   // uniform scale, clipped to the rectangle
    whole(5, 2, g => { if (im) g.image(im, STRIP.x, STRIP.y, STRIP.w, sh * s, 0, sy, im.width, sh); mount(g); }); }
  { const cap = textArrow(g, '清明上河图·武汉,11 版 11 轮盲评,评分 3.5', '7.0;另一卷 千里江山图·意临,12 版 11 轮', 240, CAPTION_BL, S3, KAI, g.NORMAL, C.ink);
    whole(5, 3, g => cap.draw(g)); }

  M.forEach((m, i) => m.i = i);
  M.sort((a, b) => a.stage - b.stage || a.x - b.x || a.i - b.i);
  window.LAYOUT = { sealL, sealR, sealT, lw };
  return M;
}

// ---------- replay ----------
function paint(g, p) {
  g.background(C.page);
  const eps = 1e-9;
  for (let k = 0; k < 6; k++) {
    let f = p * 6 - k; f = f > 1 - eps ? 1 : f < eps ? 0 : f;
    if (f <= 0) break;
    const ms = MARKS.filter(m => m.stage === k);
    const v = f * ms.length, n = Math.floor(v + eps), frac = v - n;
    for (let i = 0; i < ms.length; i++) { if (i < n) ms[i].draw(g, 1); else if (i === n && frac > eps) ms[i].draw(g, frac); }
  }
}
function parseHash() {
  const out = {}; const h = location.hash.replace(/^#/, '');
  for (const kv of h.split('&')) { if (!kv) continue; const [k, v] = kv.split('='); out[k] = v === undefined ? true : decodeURIComponent(v); }
  return out;
}
function setP(p, fromSlider) {
  P = Math.min(1, Math.max(0, p));
  if (!fromSlider) document.getElementById('scrub').value = Math.round(P * 1000);
  document.getElementById('pval').textContent = 'p = ' + P.toFixed(3);
  document.querySelectorAll('#controls [data-stage]').forEach(b => b.classList.toggle('on', Math.abs(P - (+b.dataset.stage) / 6) < 1e-6));
  if (main) main.redraw();
}
function applyHash() {
  const q = parseHash();
  if (q.stage) setP((+q.stage) / 6);
  else if (q.p !== undefined && q.p !== true) setP(+q.p);
  if (q.seq) { for (const v of String(q.seq).split(',')) { const s = document.getElementById('scrub'); s.value = Math.round(+v * 1000); s.dispatchEvent(new Event('input')); } }
  if (q.svg !== undefined) buildSVGSafe(false);
}
function buildSVG(download) {
  const host = document.getElementById('svg-host'); host.innerHTML = '';
  svgInst = new p5(s => {
    s.setup = () => { s.createCanvas(W, H, s.SVG).parent(host); s.noLoop(); s.pixelDensity(1); paint(s, 1);
      const el = host.querySelector('svg');
      if (el) { el.setAttribute('viewBox', '0 0 ' + W + ' ' + H); el.setAttribute('width', W); el.setAttribute('height', H);
        const sub = v => v.replace(/ALIGKai|ALIGSans|ALIGSeal/g, m => STACK[m]);
        el.querySelectorAll('[font-family]').forEach(n => n.setAttribute('font-family', sub(n.getAttribute('font-family'))));
        el.querySelectorAll('[style]').forEach(n => n.setAttribute('style', sub(n.getAttribute('style'))));
        const out = document.getElementById('svg-out'); out.innerHTML = ''; out.appendChild(el.cloneNode(true)); }
      if (download) s.save('ALIGN-figure1.svg');
    };
    s.draw = () => {};
  });
}
function buildSVGSafe(download) { try { buildSVG(download); } catch (e) { document.getElementById('err').textContent += 'svg: ' + (e.stack || e) + '\n'; } }

// ---------- start: fonts (each face with its final strings), then the canvas instance ----------
const KAI_SAMPLE = '程序即画 1 · 研究与规格 2 · 盲评循环 3 · 产出 风格源 研究 规格 模块 程序 渲染 盲评 卷宗 可重放页 版本 取其法,不取其景 清明上河图·武汉,11 版 11 轮盲评,评分 3.5 7.0;另一卷 千里江山图·意临,12 版 11 轮';
const SANS_SAMPLE = 'ALIGN · Agentic Loop Image Generation the program is the painting · without diffusion, anywhere Study Specification Blind Loop Outputs style windows plan.md · interfaces.md module owners no image model views · process reviewer · Codex never the code accept overrule revert user wiki · decisions replayable page versions v1 v11 every version kept one version per round program + wiki, never pixels reference executor · Claude flow repaint overrule audit a loop can DRIVE, cannot ACQUIT reviewer · user stop';

});
